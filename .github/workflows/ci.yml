name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install hash-locked test dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock'
      - name: Install project without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Lint
        run: ruff check src tests
      - name: Security scan
        run: bandit -q -r src -c pyproject.toml
      - name: Tests
        run: pytest -q
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Secret and evidence-file guard
        run: ./scripts/secret_check.sh
